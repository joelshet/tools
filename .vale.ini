StylesPath = /Users/joel/tools/.vale/styles
MinAlertLevel = warning
Vocab = Tech

Packages = Google, write-good, proselint

[*]
BasedOnStyles = Vale, Google, write-good, proselint, Joel

# Too noisy for general use
Google.Contractions = NO
Google.EmDash = NO
Google.FirstPerson = NO
Google.We = NO
write-good.E-Prime = NO
write-good.Weasel = NO
write-good.TooWordy = NO
write-good.So = NO
Vale.Spelling = NO

# Video descriptions carry verbatim shell/JSON snippets; the prose
# quote-punctuation rule false-positives on code. Scoped to the one
# filename the video pipeline emits.
[*/youtube-metadata.txt]
Google.Quotes = NO
